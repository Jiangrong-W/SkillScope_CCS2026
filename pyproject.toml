[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscope"
version = "1.0.0"
description = "Fine-grained least-privilege enforcement for Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skillscope = "skillscope.cli:main"

[tool.setuptools.packages.find]
include = ["skillscope*"]

[tool.setuptools.data-files]
"share/skillscope/prompts" = ["prompts/*.md"]
